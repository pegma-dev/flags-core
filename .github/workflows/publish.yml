# Publishes the exact tarballs prepared from a stable GitHub release tag.
# Authentication is npm trusted-publisher OIDC only; no token fallback exists.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::RELEASE_TAG must be a stable vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::RELEASE_COMMIT must be a 40-character commit ID"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          release_repo="$(mktemp -d "${RUNNER_TEMP}/flags-core-release.XXXXXX")"
          trap 'rm -rf "${release_repo}"' EXIT
          git init --bare --quiet "${release_repo}"
          git -C "${release_repo}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          allowed_signers="${release_repo}/allowed-signers"
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git -C "${release_repo}" config gpg.format ssh
          git -C "${release_repo}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${release_repo}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${release_repo}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${release_repo}" verify-tag "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git -C "${release_repo}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit,,}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${release_repo}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Check out the immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Configure approved release signers
        shell: bash
        run: |
          set -euo pipefail
          allowed_signers="${RUNNER_TEMP}/release-allowed-signers"
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git config --local gpg.format ssh
          git config --local gpg.ssh.allowedSignersFile "${allowed_signers}"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check types
        run: pnpm run check

      - name: Run tests
        run: pnpm test

      - name: Prepare and verify the release tarballs
        run: node scripts/release-packages.mjs pack --require-clean --require-main-ancestor --require-release-tag --expected-release-commit "${RELEASE_COMMIT}" --output .release

      - name: Record the package manifest digest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(sha256sum .release/package-manifest.json | awk '{print $1}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Prepared manifest SHA-256 ${digest}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload the prepared release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flags-core-release-${{ github.run_id }}
          path: .release/
          if-no-files-found: error
          include-hidden-files: false
          overwrite: true
          retention-days: 30

  smoke:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out the immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Download the prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flags-core-release-${{ github.run_id }}
          path: .release

      - name: Verify and import the prepared packages
        shell: bash
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          actual_digest="$(sha256sum .release/package-manifest.json | awk '{print $1}')"
          [[ "${actual_digest}" == "${EXPECTED_MANIFEST_DIGEST}" ]]
          node scripts/release-packages.mjs smoke --manifest .release/package-manifest.json

  publish:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_ALLOWED_SIGNERS: ${{ vars.RELEASE_ALLOWED_SIGNERS }}

    steps:
      - name: Authenticate the release source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_PRERELEASE}" != "false" ]]; then
            echo "::error::Only stable releases may publish packages"
            exit 1
          fi
          if [[ ! "${RELEASE_TAG}" =~ ^v(0\.[1-9][0-9]*|[1-9][0-9]*\.[0-9]+)\.[0-9]+$ ]]; then
            echo "::error::RELEASE_TAG must be a stable vX.Y.Z tag"
            exit 1
          fi
          if [[ ! "${RELEASE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::RELEASE_COMMIT must be a 40-character commit ID"
            exit 1
          fi
          if [[ -z "${RELEASE_ALLOWED_SIGNERS}" ]]; then
            echo "::error::RELEASE_ALLOWED_SIGNERS must contain the reviewed SSH allowed-signers entries"
            exit 1
          fi
          release_repo="$(mktemp -d "${RUNNER_TEMP}/flags-core-release.XXXXXX")"
          trap 'rm -rf "${release_repo}"' EXIT
          git init --bare --quiet "${release_repo}"
          git -C "${release_repo}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          allowed_signers="${release_repo}/allowed-signers"
          printf '%s\n' "${RELEASE_ALLOWED_SIGNERS}" > "${allowed_signers}"
          chmod 0600 "${allowed_signers}"
          git -C "${release_repo}" config gpg.format ssh
          git -C "${release_repo}" config gpg.ssh.allowedSignersFile "${allowed_signers}"
          git -C "${release_repo}" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git -C "${release_repo}" cat-file -t "refs/tags/${RELEASE_TAG}")" == "tag" ]]
          git -C "${release_repo}" verify-tag "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git -C "${release_repo}" rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "${tag_commit,,}" == "${RELEASE_COMMIT,,}" ]]
          git -C "${release_repo}" merge-base --is-ancestor \
            "${RELEASE_COMMIT}" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Use the reviewed npm release
        run: npm install --global npm@11.18.0 --ignore-scripts --registry https://registry.npmjs.org/

      - name: Download the prepared release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flags-core-release-${{ github.run_id }}
          path: .release

      - name: Verify and publish the prepared tarballs
        env:
          EXPECTED_MANIFEST_DIGEST: ${{ needs.prepare.outputs.manifest_digest }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { spawnSync } = require("node:child_process");
          const { createHash, timingSafeEqual } = require("node:crypto");
          const {
            chmodSync,
            lstatSync,
            mkdtempSync,
            readFileSync,
            readdirSync,
            rmSync,
            writeFileSync,
          } = require("node:fs");
          const { tmpdir } = require("node:os");
          const { basename, join, resolve } = require("node:path");

          const registry = "https://registry.npmjs.org/";
          const releaseDirectory = resolve(".release");
          const manifestPath = join(releaseDirectory, "package-manifest.json");

          function fail(message) {
            throw new Error(message);
          }

          function safeEqual(left, right) {
            const leftBytes = Buffer.from(left);
            const rightBytes = Buffer.from(right);
            return (
              leftBytes.length === rightBytes.length &&
              timingSafeEqual(leftBytes, rightBytes)
            );
          }

          function runNpm(arguments_, cwd, environment, allowFailure = false) {
            const result = spawnSync("npm", arguments_, {
              cwd,
              env: environment,
              encoding: "utf8",
              stdio: "pipe",
            });
            if (result.error) {
              throw result.error;
            }
            if (result.status !== 0 && !allowFailure) {
              fail(
                `npm ${arguments_[0]} failed with exit code ${result.status}:\n${result.stdout}${result.stderr}`,
              );
            }
            return result;
          }

          function parseNpmJson(stdout) {
            const text = typeof stdout === "string" ? stdout : "";
            try {
              return JSON.parse(text);
            } catch {}
            const starts = /[\[{\"]|true\b|false\b|null\b|-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?/gu;
            let match = starts.exec(text);
            while (match !== null) {
              try {
                return JSON.parse(text.slice(match.index));
              } catch {
                match = starts.exec(text);
              }
            }
            fail("npm returned no JSON");
          }

          async function main() {
            const manifestBytes = readFileSync(manifestPath);
            const manifestDigest = createHash("sha256")
              .update(manifestBytes)
              .digest("hex");
            if (!safeEqual(manifestDigest, process.env.EXPECTED_MANIFEST_DIGEST ?? "")) {
              fail("package manifest digest does not match preparation output");
            }
            const manifest = JSON.parse(manifestBytes.toString("utf8"));
            if (
              manifest.schemaVersion !== 1 ||
              manifest.releaseTag !== process.env.RELEASE_TAG ||
              manifest.gitCommit?.toLowerCase() !== process.env.RELEASE_COMMIT?.toLowerCase() ||
              !Array.isArray(manifest.packages) ||
              manifest.packages.length === 0 ||
              !manifest.packages.some(({ publish }) => publish === true)
            ) {
              fail("package manifest release metadata is invalid");
            }

            const expectedFiles = new Set([
              "package-manifest.json",
              ...manifest.packages.map(({ tarball }) => tarball),
            ]);
            if (expectedFiles.size !== manifest.packages.length + 1) {
              fail("package manifest contains duplicate tarball names");
            }
            const entries = readdirSync(releaseDirectory, { withFileTypes: true });
            if (entries.length !== expectedFiles.size) {
              fail("release directory inventory does not match the package manifest");
            }
            for (const entry of entries) {
              if (
                entry.name.startsWith(".") ||
                !expectedFiles.has(entry.name) ||
                !entry.isFile() ||
                entry.isSymbolicLink()
              ) {
                fail(`unexpected release entry: ${entry.name}`);
              }
              const metadata = lstatSync(join(releaseDirectory, entry.name));
              if (!metadata.isFile() || metadata.isSymbolicLink()) {
                fail(`release entry must be a regular file: ${entry.name}`);
              }
            }

            for (const record of manifest.packages) {
              const expectedTarball = `${record.name
                ?.slice(1)
                .replace("/", "-")}-${record.version}.tgz`;
              if (
                typeof record.name !== "string" ||
                !record.name.startsWith("@pegma/") ||
                typeof record.version !== "string" ||
                !/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/u.test(record.version) ||
                typeof record.tarball !== "string" ||
                basename(record.tarball) !== record.tarball ||
                record.tarball !== expectedTarball ||
                record.publish !== (record.version === manifest.releaseTag.slice(1)) ||
                !/^[0-9a-f]{64}$/u.test(record.sha256) ||
                !/^sha512-[A-Za-z0-9+/]+={0,2}$/u.test(record.integrity)
              ) {
                fail("package manifest contains invalid package metadata");
              }
              const bytes = readFileSync(join(releaseDirectory, record.tarball));
              const sha256 = createHash("sha256").update(bytes).digest("hex");
              const integrity = `sha512-${createHash("sha512").update(bytes).digest("base64")}`;
              if (!safeEqual(sha256, record.sha256) || !safeEqual(integrity, record.integrity)) {
                fail(`${record.name} tarball digest does not match the package manifest`);
              }
            }

            const npmDirectory = mkdtempSync(join(tmpdir(), "flags-core-publish-"));
            try {
              const userConfig = join(npmDirectory, "user.npmrc");
              const globalConfig = join(npmDirectory, "global.npmrc");
              writeFileSync(userConfig, "", { mode: 0o600 });
              writeFileSync(globalConfig, "", { mode: 0o600 });
              chmodSync(userConfig, 0o600);
              chmodSync(globalConfig, 0o600);
              const environment = {};
              const exact = new Set([
                "CI",
                "PATH",
                "HOME",
                "RUNNER_TEMP",
                "TMP",
                "TMPDIR",
                "SYSTEMROOT",
              ]);
              for (const [key, value] of Object.entries(process.env)) {
                if (
                  value !== undefined &&
                  (exact.has(key) ||
                    key.startsWith("TMP") ||
                    key.startsWith("GITHUB_") ||
                    key.startsWith("ACTIONS_ID_TOKEN_"))
                ) {
                  environment[key] = value;
                }
              }
              environment.NPM_CONFIG_USERCONFIG = userConfig;
              environment.NPM_CONFIG_GLOBALCONFIG = globalConfig;

              const common = [
                "--registry",
                registry,
                "--ignore-scripts",
                "--userconfig",
                userConfig,
                "--globalconfig",
                globalConfig,
              ];
              for (const record of manifest.packages.filter(({ publish }) => publish)) {
                const spec = `${record.name}@${record.version}`;
                const lookup = runNpm(
                  ["view", spec, "dist.integrity", "--json", ...common],
                  npmDirectory,
                  environment,
                  true,
                );
                if (lookup.status === 0) {
                  const existing = parseNpmJson(lookup.stdout);
                  if (typeof existing !== "string" || !safeEqual(existing, record.integrity)) {
                    fail(`${spec} already exists with different package bytes`);
                  }
                  process.stdout.write(`Verified existing ${spec}; skipping.\n`);
                  continue;
                }
                if (!/\bE404\b/u.test(`${lookup.stdout}\n${lookup.stderr}`)) {
                  fail(`npm registry lookup failed for ${spec}:\n${lookup.stdout}${lookup.stderr}`);
                }
                runNpm(
                  [
                    "publish",
                    join(releaseDirectory, record.tarball),
                    "--tag",
                    "latest",
                    "--access",
                    "public",
                    "--provenance",
                    ...common,
                  ],
                  npmDirectory,
                  environment,
                );
                let visible = false;
                for (let attempt = 0; attempt < 6; attempt += 1) {
                  const check = runNpm(
                    ["view", spec, "dist.integrity", "--json", ...common],
                    npmDirectory,
                    environment,
                    true,
                  );
                  if (
                    check.status === 0 &&
                    safeEqual(parseNpmJson(check.stdout), record.integrity)
                  ) {
                    visible = true;
                    break;
                  }
                  await new Promise((resolve_) => setTimeout(resolve_, 2 ** attempt * 1_000));
                }
                if (!visible) {
                  fail(`${spec} did not become visible with the prepared integrity`);
                }
              }
            } finally {
              rmSync(npmDirectory, { recursive: true, force: true });
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exitCode = 1;
          });
          NODE
